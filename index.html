<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloreriaOnline</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav>
  <ul class="nav justify-content-center nav-underline">
  <li class="nav-item">
    <a class="nav-link active" aria-current="page" href="#">Inicio</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="#">Tienda</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="#">Contacto</a>
  </li>
</ul>
</nav>
<section>
<form id="formBuscar" class="buscar center">
  <input type="text" id="buscador" class="form-control mb-4" placeholder="Buscar flor...">
</form>
<div class="center">
  <div id="estado"></div>
<div id="contenedor-flores" class="row g-4"></div>

<!-- Modal de prods -->


<div class="modal fade " id="modalCarrito" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">🛒 Carrito</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

  <div id="contenidoCarrito"></div>

  <h4 id="totalCarrito"></h4>

</div>

      <div class="modal-footer">

  <button
    type="button"
    class="btn btn-secondary"
    data-bs-dismiss="modal">
    Seguir comprando
  </button>

  <button
    id="btnPagar"
    class="btn btn-success">
    Pagar
  </button>

</div>
  </div>
</div>
</div>
</section>

<footer>

  
</footer>
</body>


</html>
